version: '3.8'

services:
  # 1. Product / Catalog Microservice
  product-service:
    build:
      context: ./backend/services/product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=${MONGO_URI}
    networks:
      - ecommerce-micro-net

  # 2. Search Microservice
  search-service:
    build:
      context: ./backend/services/search-service
      dockerfile: Dockerfile
    container_name: search-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=${MONGO_URI}
    networks:
      - ecommerce-micro-net

  # 3. Order Microservice
  order-service:
    build:
      context: ./backend/services/order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=${MONGO_URI}
      - PAYMENT_SERVICE_URL=http://payment-service:5005/api/payments
    depends_on:
      - payment-service
    networks:
      - ecommerce-micro-net

  # 4. Cart Microservice
  cart-service:
    build:
      context: ./backend/services/cart-service
      dockerfile: Dockerfile
    container_name: cart-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGO_URI=${MONGO_URI}
    volumes:
      - cart-data:/app/data
    networks:
      - ecommerce-micro-net

  # 5. Payment Microservice
  payment-service:
    build:
      context: ./backend/services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=${MONGO_URI}
    networks:
      - ecommerce-micro-net

  # 6. Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-service
    ports:
      - "5173:5173"
    depends_on:
      - product-service
      - search-service
      - order-service
      - cart-service
    networks:
      - ecommerce-micro-net

# Custom Bridge Network connecting all 5 microservices & frontend
networks:
  ecommerce-micro-net:
    driver: bridge

# Named volume for persistent data storage
volumes:
  cart-data:
