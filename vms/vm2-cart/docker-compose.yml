version: '3.8'

services:
  # Container 1: Dedicated Cart SQL Database (MySQL 8.0 Docker Image)
  cart-sql-db:
    image: mysql:8.0
    container_name: vm2-cart-sql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: cart_sqldb
    ports:
      - "3306:3306"
    volumes:
      - cart-sql-db-data:/var/lib/mysql

  # Container 2: Cart Microservice (Private VM - 10.128.0.8)
  cart-service:
    build: .
    container_name: vm2-cart-service
    restart: always
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - DB_HOST=cart-sql-db
      - DB_USER=root
      - DB_PASSWORD=secretpassword
      - DB_NAME=cart_sqldb
    depends_on:
      - cart-sql-db

volumes:
  cart-sql-db-data:
