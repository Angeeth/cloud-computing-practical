version: '3.8'

services:
  # Container 1: Dedicated Payment SQL Database (MySQL 8.0 Docker Image)
  payment-sql-db:
    image: mysql:8.0
    container_name: vm4-payment-sql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: payment_sqldb
    ports:
      - "3306:3306"
    volumes:
      - payment-sql-db-data:/var/lib/mysql

  # Container 2: Payment Microservice (Private VM - 10.128.0.10)
  payment-service:
    build: .
    container_name: vm4-payment-service
    restart: always
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - DB_HOST=payment-sql-db
      - DB_USER=root
      - DB_PASSWORD=secretpassword
      - DB_NAME=payment_sqldb
    depends_on:
      - payment-sql-db

volumes:
  payment-sql-db-data:
